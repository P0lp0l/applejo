<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="google-site-verification" content="V1vu3nAt-uCZLo5NUXueMYEHO-im3HJdixN0NC9dV-M" />
 <title>Apple Fortune - Promo Access</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }

  body {
    background: radial-gradient(circle at top, #18172b 0%, #0b0b15 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 15px;
    color: #fff;
  }

  .app-container {
    width: 100%;
    max-width: 390px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  /* ==================== شاشة البرومو كود ==================== */
  .promo-screen {
    position: relative;
    background: #121424;
    border-radius: 26px;
    padding: 28px 20px;
    border: 1.5px solid rgba(255, 255, 255, 0.08);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(56, 189, 248, 0.35);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    animation: fadeSlideIn 0.35s ease;
  }

  .promo-screen::before {
    content: "";
    position: absolute;
    top: -1px;
    left: 15%;
    right: 15%;
    height: 2px;
    background: linear-gradient(90deg, transparent, #38bdf8, #818cf8, transparent);
    border-radius: 50%;
  }

  .promo-icon-box {
    width: 64px;
    height: 64px;
    border-radius: 20px;
    background: linear-gradient(135deg, rgba(29, 140, 248, 0.18), rgba(155, 81, 224, 0.18));
    border: 1.5px solid rgba(56, 189, 248, 0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 25px rgba(79, 114, 248, 0.25);
  }

  .promo-icon-box svg {
    width: 32px;
    height: 32px;
    color: #38bdf8;
  }

  .promo-title {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: 0.5px;
    text-align: center;
    background: linear-gradient(90deg, #e0f2fe, #c4b5fd);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .promo-subtitle {
    font-size: 13px;
    color: #94a3b8;
    text-align: center;
    line-height: 1.6;
  }

  .promo-input-group {
    width: 100%;
    position: relative;
    margin-top: 4px;
  }

  .promo-input {
    width: 100%;
    height: 52px;
    border-radius: 15px;
    background: #0b0d19;
    border: 1.5px solid rgba(56, 189, 248, 0.25);
    padding: 0 16px;
    color: #ffffff;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 2px;
    text-align: center;
    text-transform: uppercase;
    outline: none;
    transition: border-color 0.25s ease, box-shadow 0.25s ease;
  }

  .promo-input::placeholder {
    color: #475569;
    letter-spacing: 1px;
    font-weight: 600;
    text-transform: none;
  }

  .promo-input:focus {
    border-color: #38bdf8;
    box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.16);
  }

  .promo-input.error {
    border-color: #ef4444;
    box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.18);
    animation: shake 0.32s ease;
  }

  .promo-msg {
    min-height: 20px;
    font-size: 12.5px;
    font-weight: 600;
    text-align: center;
    transition: opacity 0.2s ease;
  }

  .promo-msg.error {
    color: #f87171;
  }

  .promo-msg.success {
    color: #4ade80;
  }

  .btn-unlock {
    width: 100%;
    height: 52px;
    border-radius: 15px;
    border: none;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 1px;
    cursor: pointer;
    background: linear-gradient(90deg, #1d8cf8 0%, #5b6cf9 50%, #9b51e0 100%);
    color: #ffffff;
    box-shadow: 0 6px 20px rgba(79, 114, 248, 0.35);
    transition: transform 0.15s ease, opacity 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .btn-unlock:active {
    transform: scale(0.98);
  }

  .btn-unlock:disabled {
    opacity: 0.7;
    cursor: not-allowed;
  }

  /* ==================== شاشة اللعبة ==================== */
  .game-screen {
    display: none;
    flex-direction: column;
    gap: 14px;
    animation: fadeSlideIn 0.35s ease;
  }

  .game-screen.active {
    display: flex;
  }

  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(18, 20, 36, 0.85);
    border: 1px solid rgba(255, 255, 255, 0.07);
    border-radius: 14px;
    padding: 8px 12px;
    font-size: 12px;
  }

  .active-code-tag {
    display: flex;
    align-items: center;
    gap: 6px;
    color: #93c5fd;
    font-weight: 600;
  }

  .active-code-tag span {
    background: rgba(56, 189, 248, 0.14);
    color: #e0f2fe;
    padding: 3px 8px;
    border-radius: 7px;
    letter-spacing: 1px;
    font-weight: 700;
  }

  .btn-lock {
    background: rgba(239, 68, 68, 0.12);
    color: #fca5a5;
    border: 1px solid rgba(239, 68, 68, 0.25);
    border-radius: 8px;
    padding: 5px 10px;
    font-size: 11.5px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s ease;
  }

  .btn-lock:hover {
    background: rgba(239, 68, 68, 0.22);
  }

  /* اللوحة الرئيسية */
  .board-wrapper {
    position: relative;
    background: #121424;
    border-radius: 26px;
    padding: 16px 14px;
    border: 1.5px solid rgba(255, 255, 255, 0.08);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(56, 189, 248, 0.35);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .board-wrapper::before {
    content: "";
    position: absolute;
    top: -1px;
    left: 15%;
    right: 15%;
    height: 2px;
    background: linear-gradient(90deg, transparent, #38bdf8, #818cf8, transparent);
    border-radius: 50%;
  }

  .game-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 3px 4px;
    border-radius: 14px;
    transition: background 0.3s ease, transform 0.2s ease;
  }

  .game-row.active-row {
    background: rgba(56, 189, 248, 0.08);
    box-shadow: inset 0 0 12px rgba(56, 189, 248, 0.12);
  }

  .circles-group {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 1;
    justify-content: space-between;
  }

  .cell {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #c86d3b 0%, #8e411d 65%, #5c2710 100%);
    box-shadow:
      0 0 0 3px #0c0e1a,
      0 0 0 4.5px rgba(56, 189, 248, 0.14),
      inset 0 2px 4px rgba(255, 200, 160, 0.35),
      inset 0 -3px 6px rgba(0, 0, 0, 0.6);
    position: relative;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease;
  }

  .cell::after {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      -8deg,
      rgba(0, 0, 0, 0.08) 0px,
      rgba(0, 0, 0, 0.08) 2px,
      transparent 2px,
      transparent 5px
    );
    pointer-events: none;
  }

  .game-row.active-row .cell {
    box-shadow:
      0 0 0 3px #0c0e1a,
      0 0 0 5px rgba(56, 189, 248, 0.45),
      inset 0 2px 4px rgba(255, 200, 160, 0.4);
  }

  .game-row.active-row .cell:hover {
    transform: scale(1.08);
  }

  .game-row.active-row .cell:active {
    transform: scale(0.95);
  }

  .cell.revealed-good {
    background: radial-gradient(circle at 35% 30%, #16a34a 0%, #15803d 65%, #052e16 100%);
    box-shadow:
      0 0 0 3px #0c0e1a,
      0 0 0 4.5px rgba(34, 197, 94, 0.4),
      inset 0 2px 5px rgba(134, 239, 172, 0.4);
    animation: popIn 0.28s ease-out;
  }

  .cell.revealed-bad {
    background: radial-gradient(circle at 35% 30%, #9a3412 0%, #7c2d12 65%, #431407 100%);
    box-shadow:
      0 0 0 3px #0c0e1a,
      0 0 0 4.5px rgba(239, 68, 68, 0.35),
      inset 0 2px 4px rgba(254, 202, 202, 0.25);
    animation: popIn 0.28s ease-out;
  }

  .cell.dimmed {
    opacity: 0.72;
  }

  .cell svg {
    width: 28px;
    height: 28px;
    z-index: 2;
    filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.5));
  }

  .multiplier-badge {
    min-width: 72px;
    height: 28px;
    border-radius: 7px;
    background: rgba(10, 12, 22, 0.85);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.3px;
    color: #f1f5f9;
    border: 1.5px solid var(--badge-color);
    box-shadow: 0 0 8px rgba(0, 0, 0, 0.4);
    transition: all 0.25s ease;
  }

  .game-row.active-row .multiplier-badge {
    background: var(--badge-color);
    color: #090b14;
    box-shadow: 0 0 12px var(--badge-color);
  }

  .game-row.passed-row .multiplier-badge {
    opacity: 0.55;
  }

  .btn {
    width: 100%;
    height: 52px;
    border-radius: 15px;
    border: none;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    cursor: pointer;
    transition: transform 0.15s ease, opacity 0.2s ease, box-shadow 0.2s ease;
  }

  .btn:active {
    transform: scale(0.98);
  }

  .btn-show {
    background: linear-gradient(90deg, #1d8cf8 0%, #5b6cf9 50%, #9b51e0 100%);
    color: #ffffff;
    box-shadow: 0 6px 20px rgba(79, 114, 248, 0.35);
  }

  .btn-new {
    background: #101322;
    color: #bae6fd;
    border: 1.5px solid rgba(56, 189, 248, 0.25);
  }

  .btn-new:hover {
    border-color: rgba(56, 189, 248, 0.5);
  }

  @keyframes popIn {
    0% { transform: scale(0.6); }
    70% { transform: scale(1.1); }
    100% { transform: scale(1); }
  }

  @keyframes fadeSlideIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }

  @media (max-width: 360px) {
    .cell { width: 39px; height: 39px; }
    .multiplier-badge { min-width: 64px; font-size: 12px; }
  }
</style>
</head>
<body>

<div class="app-container">
  <!-- شاشة إدخال البرومو كود -->
  <div class="promo-screen" id="promoScreen">
    <div class="promo-icon-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
    </div>

    <div class="promo-title">PROMO CODE ACCESS</div>
    <p class="promo-subtitle" dir="rtl">أدخل البرومو كود لفتح صفحة الاسكريبت والبدء.</p>

    <div class="promo-input-group">
      <input
        type="text"
        id="promoInput"
        class="promo-input"
        placeholder="Enter Promo Code..."
        autocomplete="off"
        spellcheck="false"
      />
    </div>

    <div class="promo-msg" id="promoMsg" dir="rtl"></div>

    <button class="btn-unlock" id="unlockBtn">
      <span>UNLOCK GAME</span>
    </button>
  </div>

  <!-- صفحة اللعبة -->
  <div class="game-screen" id="gameScreen">
    <div class="top-bar">
      <div class="active-code-tag">
        <span>CODE</span>
        <strong id="activeCodeDisplay">---</strong>
      </div>
      <button class="btn-lock" id="lockBtn" dir="rtl">تغيير الكود</button>
    </div>

    <div class="board-wrapper" id="board"></div>

    <button class="btn btn-show" id="showAllBtn">SHOW ALL</button>
    <button class="btn btn-new" id="newGameBtn">NEW GAME</button>
  </div>
</div>

<script>
  // ==================== إعدادات البرومو كود ====================
  const VALID_PROMO_CODES = [
    "1x_6262696"
  ];

  const REQUIRE_CODE_EVERY_VISIT = true;

  const promoScreen = document.getElementById("promoScreen");
  const gameScreen = document.getElementById("gameScreen");
  const promoInput = document.getElementById("promoInput");
  const promoMsg = document.getElementById("promoMsg");
  const unlockBtn = document.getElementById("unlockBtn");
  const lockBtn = document.getElementById("lockBtn");
  const activeCodeDisplay = document.getElementById("activeCodeDisplay");

  function showMessage(text, type) {
    promoMsg.textContent = text;
    promoMsg.className = `promo-msg ${type}`;
  }

  function enterGame(code) {
    activeCodeDisplay.textContent = code;
    promoScreen.style.display = "none";
    gameScreen.classList.add("active");
    startNewGame();
  }

  function lockGame() {
    gameScreen.classList.remove("active");
    promoScreen.style.display = "flex";
    promoInput.value = "";
    promoInput.classList.remove("error");
    showMessage("", "");
    promoInput.focus();
  }

  function verifyPromoCode() {
    const enteredCode = promoInput.value.trim().toUpperCase();
    promoInput.classList.remove("error");

    if (!enteredCode) {
      promoInput.classList.add("error");
      showMessage("من فضلك أدخل البرومو كود أولاً.", "error");
      return;
    }

    const normalizedValidCodes = VALID_PROMO_CODES.map(c => c.trim().toUpperCase());

    if (normalizedValidCodes.includes(enteredCode)) {
      showMessage("تم التحقق بنجاح! جاري فتح اللعبة...", "success");
      unlockBtn.disabled = true;
      setTimeout(() => {
        unlockBtn.disabled = false;
        enterGame(enteredCode);
      }, 450);
    } else {
      promoInput.classList.add("error");
      showMessage("البرومو كود غير صحيح، حاول مرة أخرى.", "error");
    }
  }

  unlockBtn.addEventListener("click", verifyPromoCode);
  promoInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      verifyPromoCode();
    }
  });
  lockBtn.addEventListener("click", lockGame);

  if (!REQUIRE_CODE_EVERY_VISIT) {
    const saved = sessionStorage.getItem("unlockedPromoCode");
    if (saved && VALID_PROMO_CODES.map(c => c.toUpperCase()).includes(saved)) {
      enterGame(saved);
    }
  }

  // ==================== منطق وواجهة اللعبة ====================
  const rowsConfig = [
    { mult: "x69.93", color: "#dc2626", goodCount: 1 },
    { mult: "x27.92", color: "#ea580c", goodCount: 1 },
    { mult: "x11.18", color: "#d97706", goodCount: 2 },
    { mult: "x6.71",  color: "#eab308", goodCount: 2 },
    { mult: "x4.02",  color: "#a3e635", goodCount: 3 },
    { mult: "x2.41",  color: "#65a30d", goodCount: 3 },
    { mult: "x1.93",  color: "#10b981", goodCount: 4 },
    { mult: "x1.54",  color: "#14b8a6", goodCount: 4 },
    { mult: "x1.23",  color: "#3b82f6", goodCount: 4 }
  ];

  const goodAppleSVG = `
    <svg viewBox="0 0 64 64">
      <path d="M33 15 C34 8, 41 6, 44 8 C41 12, 36 14, 33 15 Z" fill="#4ade80"/>
      <path d="M31 16 C30 10, 27 8, 25 8" stroke="#78350f" stroke-width="3.5" stroke-linecap="round" fill="none"/>
      <path d="M32 18 C21 15, 11 22, 12 36 C13 49, 23 57, 32 55 C41 57, 51 49, 52 36 C53 22, 43 15, 32 18 Z" fill="#dc2626"/>
      <path d="M21 24 C17 28, 17 35, 19 40" stroke="#fca5a5" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7"/>
    </svg>
  `;

  const badAppleSVG = `
    <svg viewBox="0 0 64 64">
      <path d="M32 16 C31 10, 28 8, 26 8" stroke="#78350f" stroke-width="3.5" stroke-linecap="round" fill="none"/>
      <path d="M22 18 C27 17, 37 17, 42 18 C36 24, 36 48, 42 54 C37 56, 27 56, 22 54 C28 48, 28 24, 22 18 Z" fill="#fef3c7"/>
      <path d="M22 18 C27 17, 37 17, 42 18 C40 20, 38 21, 32 21 C26 21, 24 20, 22 18 Z" fill="#b91c1c"/>
      <path d="M22 54 C27 56, 37 56, 42 54 C40 52, 38 51, 32 51 C26 51, 24 52, 22 54 Z" fill="#b91c1c"/>
      <ellipse cx="30" cy="34" rx="1.3" ry="2.2" fill="#451a03"/>
      <ellipse cx="34" cy="38" rx="1.3" ry="2.2" fill="#451a03"/>
    </svg>
  `;

  const boardEl = document.getElementById("board");
  const showAllBtn = document.getElementById("showAllBtn");
  const newGameBtn = document.getElementById("newGameBtn");

  let gridData = [];
  let currentRow = rowsConfig.length - 1;
  let gameOver = false;

  function generateBoardData() {
    return rowsConfig.map(row => {
      const arr = Array(5).fill(false);
      let placed = 0;
      while (placed < row.goodCount) {
        const idx = Math.floor(Math.random() * 5);
        if (!arr[idx]) {
          arr[idx] = true;
          placed++;
        }
      }
      return arr;
    });
  }

  function renderBoard() {
    boardEl.innerHTML = "";
    rowsConfig.forEach((rowInfo, rIdx) => {
      const rowDiv = document.createElement("div");
      rowDiv.className = "game-row";
      rowDiv.dataset.row = rIdx;
      if (!gameOver && rIdx === currentRow) {
        rowDiv.classList.add("active-row");
      }

      const circlesGroup = document.createElement("div");
      circlesGroup.className = "circles-group";

      for (let cIdx = 0; cIdx < 5; cIdx++) {
        const cell = document.createElement("div");
        cell.className = "cell";
        cell.dataset.row = rIdx;
        cell.dataset.col = cIdx;
        cell.addEventListener("click", () => handleCellClick(rIdx, cIdx));
        circlesGroup.appendChild(cell);
      }

      const badge = document.createElement("div");
      badge.className = "multiplier-badge";
      badge.style.setProperty("--badge-color", rowInfo.color);
      badge.textContent = rowInfo.mult;

      rowDiv.appendChild(circlesGroup);
      rowDiv.appendChild(badge);
      boardEl.appendChild(rowDiv);
    });
  }

  function revealCell(rIdx, cIdx, isChosen = false) {
    const cell = boardEl.querySelector(`.cell[data-row="${rIdx}"][data-col="${cIdx}"]`);
    if (!cell || cell.classList.contains("revealed-good") || cell.classList.contains("revealed-bad")) return;

    const isGood = gridData[rIdx][cIdx];
    cell.classList.add(isGood ? "revealed-good" : "revealed-bad");
    if (!isChosen) cell.classList.add("dimmed");
    cell.innerHTML = isGood ? goodAppleSVG : badAppleSVG;
  }

  function revealRow(rIdx, chosenCol = -1) {
    for (let c = 0; c < 5; c++) {
      revealCell(rIdx, c, c === chosenCol);
    }
  }

  function handleCellClick(rIdx, cIdx) {
    if (gameOver || rIdx !== currentRow) return;

    const isGood = gridData[rIdx][cIdx];
    revealRow(rIdx, cIdx);

    const rowEl = boardEl.querySelector(`.game-row[data-row="${rIdx}"]`);
    rowEl.classList.remove("active-row");

    if (isGood) {
      rowEl.classList.add("passed-row");
      currentRow--;
      if (currentRow < 0) {
        gameOver = true;
      } else {
        const nextRowEl = boardEl.querySelector(`.game-row[data-row="${currentRow}"]`);
        if (nextRowEl) nextRowEl.classList.add("active-row");
      }
    } else {
      gameOver = true;
      revealAllBoard();
    }
  }

  function revealAllBoard() {
    gameOver = true;
    document.querySelectorAll(".game-row").forEach(r => r.classList.remove("active-row"));
    for (let r = 0; r < rowsConfig.length; r++) {
      for (let c = 0; c < 5; c++) {
        revealCell(r, c, true);
      }
    }
  }

  function startNewGame() {
    gridData = generateBoardData();
    currentRow = rowsConfig.length - 1;
    gameOver = false;
    renderBoard();
  }

  showAllBtn.addEventListener("click", revealAllBoard);
  newGameBtn.addEventListener("click", startNewGame);
</script>

</body>
</html>
